<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4efe6">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.dataset.theme = saved;
      })();
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
          <span class="brand-mark">P</span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">文章</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
            <span aria-hidden="true">◐</span>
          </button>
        </nav>
      </header>

      <main>{{ content }}</main>

      <footer class="site-footer">
        <p>© {{ 'now' | date: '%Y' }} Pepper · 保持好奇，持续记录。</p>
        <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub ↗</a>
      </footer>
    </div>
    <script>
      const toggle = document.querySelector('.theme-toggle');
      toggle?.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme;
        const next = current === 'dark' ? 'light' : current === 'light'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark')
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = next;
        localStorage.setItem('theme', next);
      });
    </script>
  </body>
</html>
