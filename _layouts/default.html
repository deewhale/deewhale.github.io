<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f5f1">
    {% include seo.html %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" href="{{ '/assets/favicon-96.png' | relative_url }}" type="image/png" sizes="96x96">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/favicon-96.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">p.</span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a>
          <a href="{{ '/topics/' | relative_url }}"{% if page.url contains '/topics/' %} aria-current="page"{% endif %}>主题</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
            <span aria-hidden="true">◐</span>
          </button>
        </nav>
      </header>

      <main id="main-content">{{ content }}</main>

      <footer class="site-footer">
        <p>© {{ 'now' | date: '%Y' }} Pepper · 保持好奇，持续记录。</p>
        <div class="footer-links">
          <a href="{{ '/editorial-policy/' | relative_url }}">编辑说明</a>
          <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub ↗</a>
        </div>
      </footer>
    </div>
    <script>
      const toggle = document.querySelector('.theme-toggle');
      toggle?.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme;
        const next = current === 'dark' ? 'light' : current === 'light'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark')
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (_) {}
        toggle.setAttribute('aria-label', next === 'dark' ? '切换为浅色主题' : '切换为深色主题');
      });
    </script>
  </body>
</html>
